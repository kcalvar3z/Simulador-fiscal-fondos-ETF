# Tema de la app: negro sobrio, con Montserrat y acentos en gris claro. Solo modo oscuro.
#
# Para retocarlo: cambia un valor, guarda y recarga la página. Si un cambio no se aplica,
# para la app (Ctrl + C) y vuelve a arrancarla.
# Los colores de las series de los gráficos están en simulador/graficos.py (COLOR_*).

[theme]
base = "dark"
font = "'Montserrat':https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap, Helvetica, Arial, sans-serif"
headingFont = "'Montserrat':https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap, Helvetica, Arial, sans-serif"
headingFontWeights = 600
metricValueFontSize = "1.9rem"
metricValueFontWeight = 600
baseRadius = "3px"
showWidgetBorder = true

primaryColor = "#d9d9dc"              # gris claro: deslizadores, selección, foco
backgroundColor = "#0b0b0c"           # negro
secondaryBackgroundColor = "#17181a"  # fondo de los campos y de las cabeceras de tabla
textColor = "#f2f2f2"
grayTextColor = "#9a9a9f"
borderColor = "#2c2d30"
linkColor = "#d9d9dc"
blueColor = "#d9d9dc"                 # avisos informativos, en gris
blueBackgroundColor = "#17181a"
blueTextColor = "#e6e6e6"
yellowColor = "#d6a24a"               # advertencias
yellowBackgroundColor = "#2b2414"
yellowTextColor = "#e8c98a"
dataframeBorderColor = "#2c2d30"
dataframeHeaderBackgroundColor = "#17181a"
dataframeHeaderTextColor = "#f2f2f2"

[browser]
# Sin estadísticas de uso de Streamlit: coherente con el aviso de privacidad de la app.
gatherUsageStats = false

[client]
# Oculta el botón «Deploy» y deja solo el menú mínimo.
toolbarMode = "minimal"
